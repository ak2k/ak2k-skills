extends: substitution
message: "Use the US spelling '%s', not '%s'. House rule: US spellings everywhere."
description: >
  Every reader of this prose is in the United States. Flags the common British forms (-our, -re, -ise, -ogue, doubled consonants, whilst/amongst) and names the US spelling.
level: error
ignorecase: true
nonword: false
action:
  name: replace
swap:
  labour: labor
  labours: labors
  laboured: labored
  labouring: laboring
  programme: program
  programmes: programs
  centre: center
  centres: centers
  centred: centered
