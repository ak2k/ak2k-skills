name: Renovate

on:
  schedule:
    # Every 4h. Renovate's own schedule: rules in renovate.json decide
    # which PRs actually open on each run; running the workflow often
    # just means "check for new upstream releases faster".
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level (debug, info, warn)
        required: false
        default: info
      overrideSchedule:
        description: Ignore schedule from renovate.json (y/n)
        required: false
        default: 'n'

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false so checkout doesn't leave the repo-scoped
      # GITHUB_TOKEN as an `http.https://github.com/.extraheader` in git config.
      # That header overrides the per-URL auth renovate builds for cross-repo
      # git-refs `ls-remote` of private flake inputs (ak2k/surefetch) → 404.
      # Harmless while renovate ran inside the Docker image, which never saw the
      # runner's git config; running natively it inherits it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # NOT secrets.GITHUB_TOKEN: that is scoped to THIS repo, so nix
            # 404s on the private ak2k/surefetch input and the whole
            # `nix flake update` behind lockFileMaintenance dies with it.
            # RENOVATE_TOKEN already spans ak2k/* — it is what renovate uses
            # to resolve the same inputs.
            access-tokens = github.com=${{ secrets.RENOVATE_TOKEN }}

      # renovate runs from nixpkgs rather than the Docker-based
      # renovatebot/github-action. The action shells out to `docker run
      # ghcr.io/renovatebot/renovate` mounting only /tmp, so the nix installed
      # above lives on the host and is invisible inside that container. Two
      # things need nix in renovate's OWN environment:
      #   1. the nix manager's lockFileMaintenance, which shells out to
      #      `nix flake update`;
      #   2. the `nix flake lock` postUpgradeTask in renovate.json, which keeps
      #      flake.lock consistent with the tag pins the customManagers rewrite.
      # Same pattern as ak2k/nix-config's renovate.yml.
      - name: renovate
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # `{}` rather than '' when not overriding: the CLI JSON-parses this
          # env directly, where the action tolerated an empty value.
          RENOVATE_FORCE: ${{ inputs.overrideSchedule == 'y' && '{"schedule":null}' || '{}' }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # No containerbase to install per-manager tooling outside the Docker
          # image, so use what `nix shell` puts on PATH.
          RENOVATE_BINARY_SOURCE: global
          # postUpgradeTasks commands are refused unless they match one of
          # these regexes, and this is admin-only config — it must live here as
          # env, NOT in renovate.json, which would be ignored. Matched against
          # the final resolved command, hence the anchors.
          RENOVATE_ALLOWED_COMMANDS: '["^nix flake lock$"]'
        # --inputs-from . so renovate resolves against this repo's pinned
        # nixpkgs and substitutes from cache instead of drifting per run.
        run: nix shell --inputs-from . nixpkgs#renovate -c renovate
