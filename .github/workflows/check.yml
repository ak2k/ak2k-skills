name: Check

on:
  push:
    branches: [main]
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/**'
      - '**/pyproject.toml'
      - '**/*.py'
  pull_request:
    branches: [main]
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/**'
      - '**/pyproject.toml'
      - '**/*.py'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # x86_64-linux
          - ubuntu-24.04-arm    # aarch64-linux (nixos-gakmedia)
          - macos-14            # aarch64-darwin (akms25, akmbp)
          # macos-13 (x86_64-darwin) dropped — GHA free tier has been capacity-
          # starved on that image for months (prior runs on this repo timed out
          # in the 24h queue), and nixpkgs is sunsetting x86_64-darwin after
          # 25.11. macos-14 covers the live darwin target.
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: ak2k
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake check (builds + pushes all packages)
        run: nix flake check -L
