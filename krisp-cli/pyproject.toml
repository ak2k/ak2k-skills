[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krisp-cli"
version = "0.1.0"
description = "Dynamic CLI for Krisp's MCP server over Streamable HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click", "httpx"]

[project.scripts]
krisp-cli = "krisp_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["krisp_cli.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
